# .github/workflows/ci.yml
# Meta-repo CI — gates every PR against dev (the integration branch) and main.
# Runs the repository-policy validator, lint-all, typecheck-all, build-all,
# test-all, changeset:status, the specs/ hardening gate's own fixture self-test
# (scripts/*.test.mjs), and the gate itself (scripts/spec-index.mjs --check).
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository policy
        run: pnpm run repo-policy:validate && pnpm run repo-policy:test

      - name: Build all packages
        run: pnpm run build-all

      - name: Typecheck
        run: pnpm run typecheck-all

      - name: Lint
        run: pnpm run lint-all

      - name: Test
        run: pnpm run test-all

      - name: Spec index gate self-test
        run: pnpm run test:scripts

      - name: Spec index check
        run: node scripts/spec-index.mjs --check
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      # The proposals/ half of the same contract: proposal frontmatter, its G1
      # review sidecars, and the freshness of the committed proposals/index.json.
      # Without this step nothing in CI ever read proposals/*.review.md.
      - name: Proposal index check
        run: node scripts/proposal-index.mjs --check

      - name: Changesets status (PR only)
        if: github.event_name == 'pull_request'
        run: pnpm run changeset:status
